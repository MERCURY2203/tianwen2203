<title>飞翔羽毛球馆订场</title>

<style>
/* 上方切换：客户端（手机框）/ 管理后台（电脑宽屏）。球场绿为主色 */
:root{--bg:#eef2ee;--card:#fff;--fg:#1d2a22;--muted:#66756b;--line:#d9e2db;--accent:#1f8a4c;--accent-soft:#dff2e6;--taken:#cfd6d1;--lock:#d9a441;--danger:#c0392b;--side:#f6f8f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b231e;--fg:#e4ece6;--muted:#93a399;--line:#2c3830;--accent:#3cb871;--accent-soft:#1f3a2a;--taken:#38433c;--lock:#a07a2c;--danger:#e2675a;--side:#161e19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b231e;--fg:#e4ece6;--muted:#93a399;--line:#2c3830;--accent:#3cb871;--accent-soft:#1f3a2a;--taken:#38433c;--lock:#a07a2c;--danger:#e2675a;--side:#161e19;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.switch{display:flex;gap:4px;max-width:420px;margin:0 auto 6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
.switch button{flex:1;border:0;background:none;padding:8px;border-radius:7px;color:var(--muted);cursor:pointer;font-size:13px}
.switch button.on{background:var(--accent);color:#fff}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0 0 12px}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:0;border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.red{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lnk{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-size:inherit}
.muted{color:var(--muted);font-size:12px}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.off{background:var(--taken);color:var(--muted)}
.pill.warn{background:var(--lock);color:#fff}
select,input{font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font-family:inherit}
h3{margin:0;font-size:15px}
/* 手机 */
.phone{width:100%;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;height:760px;max-height:calc(100vh - 60px);min-height:520px}
.phone>*{flex:none}
.top{background:var(--accent);color:#fff;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.top small{font-weight:400;opacity:.85;font-size:12px}
.phone>.pmain,.phone>.gate{flex:1 1 0;min-height:0;overflow-y:auto}
.pmain{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pmain>*{flex:none}
.tabs{display:flex;border-top:1px solid var(--line)}
.tabs button{flex:1;padding:12px 0;border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer}
.tabs button.on{color:var(--accent);font-weight:600}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.days button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 9px;font-size:12px;cursor:pointer;line-height:1.4}
.days button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.days em{font-style:normal;font-size:10px;opacity:.75;display:block}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.grid th,.grid td{border:1px solid var(--line);text-align:center;padding:0}
.grid th{background:var(--side);color:var(--muted);font-weight:500;padding:4px 6px;white-space:nowrap}
.grid tr>th:first-child{position:sticky;left:0;z-index:1}
.grid td button{width:40px;height:30px;border:0;background:transparent;color:var(--fg);font-size:11px;cursor:pointer}
.grid td button.taken{background:var(--taken);color:var(--muted)}
.grid td button.past{background:var(--taken);color:var(--muted);opacity:.5;cursor:not-allowed}
.grid td button.lock{background:var(--lock);color:#fff}
.grid td button.sel{background:var(--accent);color:#fff}
.bn{position:relative;margin:-14px -14px 0;aspect-ratio:16/9;max-width:none;overflow:hidden;background:var(--taken);touch-action:pan-y;cursor:grab;user-select:none}
.bn-track{display:flex;height:100%;transition:transform .5s ease}
.bn-track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.bn-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.bn-dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:width .3s}
.bn-dots i.on{background:#fff;width:16px}
.bn-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block}
@media (prefers-reduced-motion:reduce){.bn-track{transition:none}}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 12px;gap:10px;position:sticky;bottom:0;z-index:3;border:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.12)}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 20px;text-align:center}
.logo-img{display:block;width:78%;max-width:300px;margin:0 auto;background:#fff;border-radius:12px;padding:6px}
.chk{font-size:13px;display:flex;gap:6px;align-items:flex-start;text-align:left;line-height:1.6}
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.menu button{display:flex;justify-content:space-between;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--fg);padding:13px 14px;font-size:14px;cursor:pointer;text-align:left}
.menu button:last-child{border-bottom:0}
.menu button.danger{color:var(--danger)}
/* 后台 */
.admin{max-width:1100px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:190px 1fr;min-height:620px}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side .brand{font-weight:700;padding:0 8px 4px;color:var(--accent)}
.side .whoami{font-size:12px;color:var(--muted);padding:0 8px 12px}
.side button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:7px;color:var(--fg);cursor:pointer;font-size:13px}
.side button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.amain{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl{width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{background:var(--side);color:var(--muted);font-weight:500}
.tbl tr:last-child td{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--side);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:64px 1fr 40px;gap:8px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.hbar div{height:10px;background:var(--accent);border-radius:3px;min-width:2px}
.login{max-width:360px;margin:40px auto;display:flex;flex-direction:column;gap:12px;padding:0 16px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13px}
@media (max-width:720px){.admin{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.side .brand,.side .whoami{width:100%}}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--card);width:100%;max-width:440px;max-height:82vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.doc{font-size:13px;line-height:1.75}
.doc h4{margin:12px 0 2px;font-size:14px}
.doc p{margin:2px 0}
[hidden]{display:none!important}
.anavbar{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.anavbar b{font-size:17px;color:var(--accent)}.anavbar .muted{flex:1;min-width:0}
.anavbar button{border:0;background:var(--side);color:var(--fg);border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.anavbar button i{display:inline-block;font-style:normal;margin-left:4px;transition:transform .2s}.anavbar button.open i{transform:rotate(180deg)}
.anav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px 12px;border-bottom:1px solid var(--line)}
.anav button{height:42px;border:0;border-radius:8px;background:var(--side);color:var(--fg);font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;padding:0 2px}
.anav button.on{background:var(--accent);color:#fff;font-weight:600}
.pcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:var(--card);text-align:left;padding:0;color:var(--fg);font:inherit;display:block;width:100%}
.pcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--taken)}
.pcard.out img{opacity:.5}
.pinfo{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:10px 12px 12px}
.pinfo .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo>div:first-child{min-width:0}
.price{color:var(--danger);font-weight:700;white-space:nowrap;font-size:13px}.price b{font-size:20px}
.ptag{position:relative}.ptag span{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px}
.pd-cover{margin:-14px -14px 0;width:calc(100% + 28px);max-width:none;aspect-ratio:16/9;object-fit:cover;display:block}
.pd-img{width:calc(100% + 28px);max-width:none;margin:0 -14px;display:block}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.stepper button{width:32px;height:30px;border:0;background:var(--side);color:var(--fg);font-size:16px;cursor:pointer}
.stepper button:disabled{color:var(--muted);cursor:not-allowed}
.stepper span{width:34px;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--side);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:7px;color:var(--muted);cursor:pointer;font-size:13px}
.seg button.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vch{display:flex;justify-content:space-between;align-items:center;border:1px dashed var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 10px;gap:8px}
.vch.off{border-color:var(--line);background:var(--side)}
.vch .code{font-size:20px;font-weight:700;letter-spacing:3px;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.vch.off .code{color:var(--muted);text-decoration:line-through}
.vch .lk{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qr{background:#fff;border-radius:8px;max-width:100%}
.bigcode{font-size:28px;font-weight:700;letter-spacing:6px;font-family:ui-monospace,Menlo,monospace}
.scanbtn{width:100%;padding:16px;font-size:16px}
.vinfo{border-width:2px}.vinfo.good{border-color:var(--accent)}.vinfo.bad{border-color:var(--danger)}
.thumbrow{display:flex;gap:10px}.thumbrow img{width:112px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none}
.thumbrow>div{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.ef{display:flex;flex-direction:column;gap:4px;font-size:13px}.ef input,.ef textarea{width:100%;box-sizing:border-box}
.ef textarea{min-height:70px;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font-family:inherit}
.imgs{display:flex;flex-direction:column;gap:8px}.imgs img{width:100%;border-radius:6px;display:block}
.bn img{cursor:pointer}
.toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:30}

function cBook(){
  const ds=days7(), d=ds[S.day], tk=takenMap(), p=price(d);
  let h=bnHTML()+`<div class="days">${ds.map((x,i)=>`<button data-d="${i}" class="${i===S.day?'on':''}">${i?'周'+WK[dow(x)]:'今天'}<br>${+x.slice(5,7)}/${+x.slice(8)}<em>${isHol(x)?'节假日':'工作日'} ¥${price(x)}</em></button>`).join('')}</div>`;
  h+=`<div class="row"><span>${md(d)} ${isHol(d)?'节假日':'工作日'}价 <b>¥${p}</b>/小时</span><span class="muted">营业 ${settings.open}:00–${settings.close}:00</span></div>`;
  h+=`<div class="legend"><span><i></i>可订</span><span><i style="background:var(--accent)"></i>已选</span><span><i style="background:var(--taken)"></i>已订</span><span><i style="background:var(--lock)"></i>馆方保留</span></div>`;
  h+=`<div class="grid-wrap"><table class="grid"><tr><th>时段</th>${[...Array(COURTS)].map((_,i)=>`<th>${i+1}号</th>`).join('')}</tr>`;
  for(let hr=settings.open;hr<settings.close;hr++){
    h+=`<tr><th>${hr}:00</th>`;
    for(let c=1;c<=COURTS;c++){
      const k=K(d,c,hr);let cls='',t='',dis='';
      if(startMs(d,hr)<=Date.now()){cls='past';t='—';dis='disabled'}
      else if(locks.has(k)){cls='lock';t='保留';dis='disabled'}
      else if(tk[k]){cls='taken';t='已订';dis='disabled'}
      else if(S.sel.has(k)){cls='sel';t='✓'}
      h+=`<td><button class="${cls}" data-k="${k}" ${dis} aria-label="${c}号场 ${hr}点">${t}</button></td>`;
    }
    h+='</tr>';
  }
  h+=`</table></div><div class="bar"><span>已选 ${S.sel.size} 小时　合计 <b>¥${S.sel.size*p}</b></span><button class="btn" id="payBtn" ${S.sel.size?'':'disabled'}>微信支付</button></div>`;
  $('pv').innerHTML=h;
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.day=+b.dataset.d;S.sel.clear();render()});
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.sel.has(k)?S.sel.delete(k):S.sel.add(k);render()});
  $('payBtn').onclick=()=>S.phone?confirmPay():askPhone(confirmPay);
  bindBanner();
}
function askPhone(next){
  sheet(`<h3>${VENUE} 申请</h3><p>获取你的手机号</p><p class="muted">用于订场联系、开场提醒及退款协商，仅馆方可见。</p><p><b>135 **** 2203</b>　微信绑定号码</p>
  <button class="btn" id="okB">允许</button><button class="btn ghost" id="noB">不允许</button><p class="muted">微信官方“手机号快速验证”（getPhoneNumber）</p>`);
  $('okB').onclick=()=>{S.phone='13800000000';closeSheet();next()};
  $('noB').onclick=()=>{closeSheet();toast('需要手机号才能订场')};
}
function confirmPay(){
  const d=days7()[S.day], slots=[...S.sel].map(k=>{const[,c,h]=k.split('|');return{c:+c,h:+h}}), amt=slots.length*price(d);
  const tmp={slots};
  sheet(`<h3>确认订单</h3><p>${md(d)} 周${WK[dow(d)]}</p><p>${slotText(tmp)}</p><p>金额 <b>¥${amt}</b></p>
  <p class="muted">请在10分钟内完成支付，超时场地自动释放。开场前15分钟以前可自助取消并全额退款。（示例，不会真的扣款）</p>
  <button class="btn" id="okB">确认支付 ¥${amt}</button><button class="btn ghost" id="noB">返回修改</button>`);
  $('okB').onclick=()=>{
    const tk=takenMap();
    if(slots.some(x=>tk[K(d,x.c,x.h)]||locks.has(K(d,x.c,x.h)))){closeSheet();S.sel.clear();toast('有场地刚被别人订走，请重新选择');return render()}
    wxPay(amt,()=>{
      const o=mkOrder('微信用户'+S.phone.slice(7),S.phone,d,slots);
      notify(`新订单 #${o.id} ${o.name}，${md(d)} ${slotText(o)}，¥${o.amt}`);
      S.sel.clear();closeSheet();toast('支付成功');S.ctab='mine';S.otab='court';render();
    });
  };
  $('noB').onclick=closeSheet;
}
function cMine(){
  const seg=`<div class="seg"><button data-ot="court" class="${S.otab==='court'?'on':''}">订场</button><button data-ot="act" class="${S.otab==='act'?'on':''}">活动</button></div>`;
  if(S.otab==='act'){cMineAct(seg);return}
  const mine=orders.filter(o=>S.phone&&o.phone===S.phone).slice().reverse();
  let h=seg+`<p class="muted">开场前1小时，会通过微信服务通知提醒你。</p>`;
  h+=mine.length?mine.map(o=>`<div class="item"><div class="row"><b>${md(o.date)} 周${WK[dow(o.date)]}</b><span class="pill ${o.status==='已支付'?'':'off'}">${o.status}</span></div>
    <div>${slotText(o)}</div><div class="row"><span class="muted">订单号 ${o.id}</span><b>¥${o.amt}</b></div>
    ${o.status==='已支付'?(canCancel(o)?`<button class="btn red" data-cx="${o.id}">取消并退款</button>`:`<span class="muted">距开场不足15分钟，无法自助取消。如需退款请联系 ${CONTACT}</span>`):''}</div>`).join('')
    :`<p class="muted">还没有订单，去“订场”选个时段吧。</p>`;
  $('pv').innerHTML=h;
  bindSeg();
  document.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>{
    const o=orders.find(x=>x.id==b.dataset.cx);
    sheet(`<h3>取消订单 ${o.id}？</h3><p>将全额退回 ¥${o.amt} 到你的微信。</p><button class="btn red" id="okB">确定取消</button><button class="btn ghost" id="noB">先不取消</button>`);
    $('okB').onclick=()=>{o.status='已退款';notify(`客户取消 #${o.id}，已自动退款 ¥${o.amt}`);closeSheet();toast('已取消，退款将原路返回');render()};
    $('noB').onclick=closeSheet;
  });
}
function cMe(){
  $('pv').innerHTML=`<div class="item"><span class="muted">我的手机号</span><b>${S.phone?maskPhone(S.phone):'未授权（订场时授权）'}</b></div>
  <div class="menu"><button data-doc="terms">用户协议<span>›</span></button><button data-doc="privacy">隐私政策<span>›</span></button>
  <button id="ctB">联系馆方<span class="muted">${CONTACT}</span></button><button id="delB" class="danger">注销账号<span>›</span></button></div>
  <div class="menu"><button id="admB">管理员登录<span>›</span></button></div>
  <p class="muted">主体：${CO}</p>`;
  $('admB').onclick=()=>{S.view='admin';render()};
  document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>showDoc(b.dataset.doc));
  $('ctB').onclick=()=>toast('请致电 '+CONTACT);
  $('delB').onclick=()=>{
    const pending=orders.some(o=>o.phone===S.phone&&S.phone&&o.status==='已支付'&&startMs(o.date,firstH(o))>Date.now());
    const pv=porders.some(o=>S.phone&&o.phone===S.phone&&o.vouchers.some(v=>v.status==='未使用'));
    if(pv)return sheet(`<h3>暂时无法注销</h3><p>你还有未使用的活动券。请先使用或退款后再注销。</p><button class="btn" onclick="closeSheet()">知道了</button>`);
    if(pending)return sheet(`<h3>暂时无法注销</h3><p>你还有未开场的订单。请先取消，或等订单结束后再注销。</p><button class="btn" onclick="closeSheet()">知道了</button>`);
    sheet(`<h3>确定注销账号？</h3><p>注销后将立即删除你的手机号等个人信息，且无法恢复。历史订单金额记录会按财务要求保留，但不再关联你的身份。</p>
    <button class="btn red" id="okB">确认注销</button><button class="btn ghost" id="noB">取消</button>`);
    $('okB').onclick=()=>{orders.concat(porders).forEach(o=>{if(S.phone&&o.phone===S.phone){o.phone=null;o.name='已注销用户'}});S.phone=null;S.agreed=false;S.ctab='book';closeSheet();toast('账号已注销');render()};
    $('noB').onclick=closeSheet;
  };
}

function bindSeg(){document.querySelectorAll('[data-ot]').forEach(b=>b.onclick=()=>{S.otab=b.dataset.ot;render()})}
function cAct(){
  if(S.pid){cProduct();return}
  const list=products.filter(pOnSale);
  $('pv').innerHTML=list.length?list.map(p=>{const out=p.left!=null&&p.left<=0;return `<button class="pcard ${out?'out':''}" data-pid="${p.id}"><div class="ptag"><img src="${p.cover}" alt="${p.name}">${out?'<span>已售罄</span>':''}</div><div class="pinfo"><div><div class="nm">${p.name}</div><div class="muted">${p.validUntil?'有效期至 '+p.validUntil:'长期有效'}${p.left!=null&&!out?' · 剩 '+p.left+' 份':''}</div></div><div class="price">¥<b>${p.price}</b></div></div></button>`}).join(''):'<p class="muted">暂时没有活动，敬请期待。</p>';
  document.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>{S.pid=b.dataset.pid;S.qty=1;render()});
}
function cProduct(){
  const p=findP(S.pid);if(!p){S.pid='';return cAct()}
  const out=p.left!=null&&p.left<=0, can=pOnSale(p)&&!out, max=Math.max(1,Math.min(20,p.left==null?20:p.left));
  if(S.qty>max)S.qty=max;
  const total=Math.round(p.price*S.qty*100)/100;
  $('pv').innerHTML=`<img class="pd-cover" src="${p.cover}" alt="${p.name}">
  <div class="row" style="align-items:flex-start"><h3 style="flex:1;min-width:0">${p.name}</h3><span class="price">¥<b>${p.price}</b></span></div>
  <div class="muted">${p.validUntil?'有效期至 '+p.validUntil+'，过期未使用自动全额退款':'长期有效'}${p.left!=null?(out?' · 已售罄':' · 剩余 '+p.left+' 份'):''}</div>
  <div class="muted">购买后凭核销码到店使用；未使用前可随时在“订单”页退款</div>
  ${p.desc?`<p style="margin:0;line-height:1.7">${p.desc}</p>`:''}
  ${p.images.map((src,i)=>`<img class="pd-img" src="${src}" alt="详情图 ${i+1}">`).join('')}
  <div class="bar"><span class="row" style="gap:10px;flex-wrap:nowrap"><span class="stepper"><button id="qm" ${S.qty<=1?'disabled':''} aria-label="减少">－</button><span>${S.qty}</span><button id="qp" ${S.qty>=max||!can?'disabled':''} aria-label="增加">＋</button></span><span>合计 <b>¥${total}</b></span></span><button class="btn" id="ppay" ${can?'':'disabled'}>${can?'微信支付':out?'已售罄':'已下架'}</button></div>
  <button class="lnk" id="pback" style="align-self:flex-start">‹ 返回活动列表</button>`;
  $('qm').onclick=()=>{S.qty--;render()};$('qp').onclick=()=>{S.qty++;render()};
  $('pback').onclick=()=>{S.pid='';render()};
  $('ppay').onclick=()=>{const go=()=>{
    if(p.left!=null&&p.left<S.qty){toast(p.left?`只剩 ${p.left} 份了`:'已售罄');return render()}
    wxPay(total,()=>{if(p.left!=null)p.left-=S.qty;p.sold+=S.qty;const o=mkPOrder('微信用户'+S.phone.slice(7),S.phone,p,S.qty);notify(`活动新订单 #${o.id} ${p.name} ×${o.qty}，¥${o.amt}`);closeSheet();toast('支付成功');S.pid='';S.ctab='mine';S.otab='act';render()})};
    S.phone?go():askPhone(go)};
}
function cMineAct(seg){
  const mine=porders.filter(o=>S.phone&&o.phone===S.phone).slice().reverse();
  const today=TODAY();
  $('pv').innerHTML=seg+(mine.length?mine.map(o=>{const exp=o.validUntil&&o.validUntil<today;return `<div class="item"><div class="thumbrow"><img src="${o.cover}" alt=""><div><div class="row"><b>${o.pname}</b><span class="pill ${o.status==='已支付'?'':'off'}">${o.status}</span></div><span class="muted">¥${o.unit} × ${o.qty}　合计 ¥${o.amt}</span><span class="muted">${o.validUntil?'有效期至 '+o.validUntil:'长期有效'}</span></div></div>
    ${o.vouchers.map((v,j)=>`<div class="vch ${v.status==='未使用'?'':'off'}"><button class="lk" data-qr="${o.id}|${j}" ${v.status==='未使用'?'':'disabled'}><span class="muted">第 ${j+1} 张</span><div class="code">${v.code}</div><span class="muted">${v.status==='未使用'?'点这里出示二维码':v.usedAt?v.usedAt+' 已核销':''}</span></button><span class="row" style="flex-direction:column;align-items:flex-end;gap:6px"><span class="pill ${v.status==='未使用'?'':'off'}">${v.status}</span>${v.status==='未使用'&&!exp?`<button class="lnk" style="color:var(--danger)" data-rf="${o.id}|${j}">退款</button>`:''}</span></div>`).join('')}
    ${o.refund?`<span class="muted">已退款 ¥${o.refund}，原路退回微信</span>`:''}</div>`}).join(''):'<p class="muted">还没有活动订单，去“活动”看看吧。</p>');
  bindSeg();
  document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>{const[id,j]=b.dataset.qr.split('|');const o=porders.find(x=>x.id==id),v=o.vouchers[+j];
    sheet(`<div class="qrwrap"><h3>${o.pname}</h3><span class="muted">第 ${+j+1} / ${o.qty} 张　${o.validUntil?'有效期至 '+o.validUntil:'长期有效'}</span>${qrSVG('FXV:'+v.code,200)}<div class="bigcode">${v.code}</div><span class="muted">请向店员出示二维码，或报上方6位数字码</span></div><button class="btn" onclick="closeSheet();render()">完成</button>`)});
  document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{const[id,j]=b.dataset.rf.split('|');const o=porders.find(x=>x.id==id),v=o.vouchers[+j];
    sheet(`<h3>退款</h3><p>${o.pname}（第 ${+j+1} 张，券码 ${v.code}）</p><p>将退回 ¥${o.unit} 到你的微信，退款后这张券作废。</p><button class="btn red" id="okB">确定退款</button><button class="btn ghost" id="noB">先不退</button>`);
    $('okB').onclick=()=>{refundV(o,+j,'客户');closeSheet();toast('已退款');render()};$('noB').onclick=closeSheet});
}
function refundV(o,j,by){const v=o.vouchers[j];if(v.status!=='未使用')return;v.status='已退款';o.refund+=o.unit;const p=findP(o.pid);if(p){p.sold--;if(p.left!=null)p.left++}
  if(o.vouchers.every(x=>x.status==='已退款'))o.status='已退款';notify(`${by}退款：${o.pname} 券 ${v.code}，¥${o.unit}`)}

function readImg(file,crop,cb){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');
  if(crop){c.width=1280;c.height=720;const r=Math.max(1280/im.width,720/im.height),w=im.width*r,h=im.height*r;c.getContext('2d').drawImage(im,(1280-w)/2,(720-h)/2,w,h)}
  else{const w=Math.min(1080,im.width),h=Math.round(im.height*w/im.width);c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h)}
  cb(c.toDataURL('image/jpeg',.82))};im.onerror=()=>toast('这张图片打不开，请换一张');im.src=rd.result};rd.readAsDataURL(file)}

function aNotice(){
  $('av').innerHTML=`<h3>消息通知</h3><p class="muted">正式版中，这些会通过微信发送给老板。</p>
  ${notices.length?notices.map(n=>`<div class="item"><span class="muted">${n.at}</span><span>${n.t}</span></div>`).join(''):'<p class="muted">暂无通知。</p>'}`;
}
function aPrice(){
  const t=TODAY(), cur=ruleFor(t);
  const st=r=>r.from>t?'<span class="pill warn">待生效</span>':r===cur?'<span class="pill">执行中</span>':'<span class="pill off">已失效</span>';
  $('av').innerHTML=`<h3>价格设置</h3>
  <div class="stats"><div class="stat"><span class="muted">当前工作日价</span><b>¥${cur.weekday}/小时</b></div><div class="stat"><span class="muted">当前节假日价（含周末）</span><b>¥${cur.holiday}/小时</b></div></div>
  <div class="box"><b>设置新价格</b>
    <div class="form"><label>工作日 ¥ <input id="pw1" type="number" min="1" value="${cur.weekday}" style="width:80px"></label><label>节假日 ¥ <input id="pw2" type="number" min="1" value="${cur.holiday}" style="width:80px"></label></div>
    <div class="form"><label><input type="radio" name="when" id="wNow" checked> 立即生效</label><label><input type="radio" name="when" id="wDate"> 从指定日期起</label><input type="date" id="wD" min="${addD(t,1)}" value="${addD(t,7)}"></div>
    <div><button class="btn" id="saveP">保存</button></div>
    <p class="muted">已支付的订单按下单时价格，不受影响。立即生效后，客人刷新即看到新价格。</p></div>
  <b>价格记录</b><div class="tbl-wrap"><table class="tbl"><tr><th>生效日期</th><th>工作日</th><th>节假日</th><th>设置人</th><th>设置时间</th><th>状态</th><th></th></tr>
  ${rules.slice().sort((a,b)=>b.from.localeCompare(a.from)).map(r=>`<tr><td>${r.from}</td><td>¥${r.weekday}</td><td>¥${r.holiday}</td><td>${r.by}</td><td>${r.at}</td><td>${st(r)}</td><td>${r.from>t?`<button class="btn red sm" data-rm="${rules.indexOf(r)}">删除</button>`:''}</td></tr>`).join('')}</table></div>`;
  $('saveP').onclick=()=>{const a=+$('pw1').value,b=+$('pw2').value;if(!(a>0&&b>0))return toast('请填写正确的价格');
    const from=$('wNow').checked?t:$('wD').value;if(!from||from<t)return toast('请选择今天以后的日期');
    rules.push({from,weekday:a,holiday:b,by:S.admin.name,at:nowText()});toast(from===t?'新价格已生效':`将于 ${from} 起生效`);render()};
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{rules.splice(+b.dataset.rm,1);toast('已删除');render()});
}
function aBanner(){
  const n=banners.length, full=n>=5;
  $('av').innerHTML=`<h3>广告牌</h3><p class="muted">老板和员工都可以管理。显示在客人“订场”页最上方，每张停留10秒，客人也能左右滑动；可以设置点击后打开某个活动商品。最多5张，比例 16:9（建议 1280×720 或 1920×1080 像素）。</p>
  ${n?banners.map((b,i)=>`<div class="item"><img class="bn-thumb" src="${b.src}" alt="第${i+1}张"><label class="row">点击后打开<select data-lk="${i}"><option value="">不链接</option>${products.filter(x=>x.active).map(x=>`<option value="${x.id}" ${b.pid===x.id?'selected':''}>${x.name}</option>`).join('')}</select></label><div class="row"><span class="muted">第 ${i+1} 张</span><span class="row" style="gap:6px">${i?`<button class="btn ghost sm" data-mv="${i}" data-dir="-1">上移</button>`:''}${i<n-1?`<button class="btn ghost sm" data-mv="${i}" data-dir="1">下移</button>`:''}<button class="btn red sm" data-del="${i}">删除</button></span></div></div>`).join(''):'<p class="muted">还没有广告图，客人端暂时不显示广告牌。</p>'}
  <label class="btn" style="text-align:center;${full?'opacity:.4;pointer-events:none':''}">${full?'已满5张':`添加图片（${n}/5）`}<input type="file" accept="image/*" id="bnFile" hidden></label>
  <p class="muted">示例：上传后自动取图片中间部分裁成 16:9。正式版在手机上可以自己框选裁剪范围。</p>`;
  document.querySelectorAll('[data-lk]').forEach(s=>s.onchange=()=>{banners[+s.dataset.lk].pid=s.value;toast('已设置')});
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const i=+b.dataset.mv,j=i+(+b.dataset.dir);[banners[i],banners[j]]=[banners[j],banners[i]];S.bi=0;render()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const i=+b.dataset.del;
    sheet(`<h3>删除第 ${i+1} 张广告图？</h3><p>删除后客人端马上看不到。</p><button class="btn red" id="okB">确定删除</button><button class="btn ghost" id="noB">取消</button>`);
    $('okB').onclick=()=>{banners.splice(i,1);S.bi=0;closeSheet();toast('已删除');render()};$('noB').onclick=closeSheet;});
  const f=$('bnFile');if(f)f.onchange=()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{
    const W=1280,H=720,c=document.createElement('canvas');c.width=W;c.height=H;const r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;
    c.getContext('2d').drawImage(im,(W-w)/2,(H-h)/2,w,h);banners.push({src:c.toDataURL('image/jpeg',.82),pid:''});toast('已添加');render()};im.onerror=()=>toast('这张图片打不开，请换一张');im.src=rd.result};rd.readAsDataURL(file)};
}
function aHours(){
  const opt=(a,b,v)=>[...Array(b-a+1)].map((_,i)=>`<option ${a+i===v?'selected':''}>${a+i}</option>`).join('');
  const marks=[...[...hol].map(d=>[d,'节假日']),...[...work].map(d=>[d,'调休上班'])].sort();
  $('av').innerHTML=`<h3>营业时间与节假日</h3>
  <div class="box"><b>营业时间（北京时间）</b><div class="form"><select id="ho">${opt(5,12,settings.open)}</select> 点 至 <select id="hc">${opt(18,24,settings.close)}</select> 点 <button class="btn" id="saveH">保存</button></div><p class="muted">已付款的订单不受影响。</p></div>
  <div class="box"><b>节假日标记</b><p class="muted">周末默认按节假日价。法定节假日请标为“节假日”，调休要上班的周末请标为“调休上班”（按工作日价）。</p>
    <div class="form"><input type="date" id="hd" value="${TODAY()}"><button class="btn" id="mH">设为节假日</button><button class="btn ghost" id="mW">设为调休上班</button><button class="btn red" id="mC">恢复默认</button></div>
    ${marks.length?`<div class="tbl-wrap"><table class="tbl"><tr><th>日期</th><th>类型</th><th>价格</th></tr>${marks.map(([d,t])=>`<tr><td>${d}</td><td>${t}</td><td>¥${price(d)}</td></tr>`).join('')}</table></div>`:'<p class="muted">暂无手动标记的日期。</p>'}</div>`;
  $('saveH').onclick=()=>{const o=+$('ho').value,c=+$('hc').value;if(o>=c)return toast('结束时间要晚于开始时间');settings.open=o;settings.close=c;toast('营业时间已更新');render()};
  const d=()=>$('hd').value;
  $('mH').onclick=()=>{if(!d())return;hol.add(d());work.delete(d());render()};
  $('mW').onclick=()=>{if(!d())return;work.add(d());hol.delete(d());render()};
  $('mC').onclick=()=>{hol.delete(d());work.delete(d());render()};
}
function aReport(){
  const t=TODAY(), paid=orders.filter(o=>o.status==='已支付'), ds=days7();
  const today=paid.filter(o=>o.date===t), week=paid.filter(o=>ds.includes(o.date));
  const hrs=settings.close-settings.open, used=today.reduce((s,o)=>s+o.slots.length,0);
  const byCourt=[...Array(COURTS)].map((_,i)=>week.reduce((s,o)=>s+o.slots.filter(x=>x.c===i+1).length,0));
  const byHour={};week.forEach(o=>o.slots.forEach(x=>byHour[x.h]=(byHour[x.h]||0)+1));
  const mx=Math.max(1,...byCourt), mh=Math.max(1,...Object.values(byHour));
  const refunds=orders.filter(o=>o.status==='已退款').reduce((s,o)=>s+o.amt,0);
  $('av').innerHTML=`<h3>营收报表</h3><div class="stats">
  <div class="stat"><span class="muted">今日订场营收</span><b>¥${today.reduce((s,o)=>s+o.amt,0)}</b></div>
  <div class="stat"><span class="muted">未来7天已订金额</span><b>¥${week.reduce((s,o)=>s+o.amt,0)}</b></div>
  <div class="stat"><span class="muted">今日场地使用率</span><b>${Math.round(used/(COURTS*hrs)*100)}%</b></div>
  <div class="stat"><span class="muted">累计订场退款</span><b>¥${refunds}</b></div><div class="stat"><span class="muted">活动收款（已扣退款）</span><b>¥${porders.reduce((t,o)=>t+o.amt-o.refund,0)}</b></div></div>
  <div class="box"><b>各场地使用小时数（未来7天）</b>${byCourt.map((n,i)=>`<div class="hbar"><span>${i+1}号场</span><div style="width:${n/mx*100}%"></div><span>${n}</span></div>`).join('')}</div>
  <div class="box"><b>热门时段（未来7天）</b>${[...Array(hrs)].map((_,i)=>{const h=settings.open+i,n=byHour[h]||0;return `<div class="hbar"><span>${h}:00</span><div style="width:${n/mh*100}%"></div><span>${n}</span></div>`}).join('')}</div>`;
}
function aStaff(){
  $('av').innerHTML=`<h3>员工账号</h3><p class="muted">员工可以：核销、查看订单和客户电话、取消退款、锁场/解锁、管理活动商品和广告牌。价格、营业时间、报表、员工管理只有老板能操作。</p>
  <div class="tbl-wrap"><table class="tbl"><tr><th>姓名</th><th>登录账号</th><th>角色</th><th>状态</th><th></th></tr>
  ${staff.map((s,i)=>`<tr><td>${s.name}</td><td>${s.acc}</td><td>${s.role}</td><td>${s.active?'<span class="pill">启用</span>':'<span class="pill off">已停用</span>'}</td><td>${s.role==='员工'?`<button class="btn ghost sm" data-tg="${i}">${s.active?'停用':'启用'}</button>`:''}</td></tr>`).join('')}</table></div>
  <div class="box"><b>新增员工</b><div class="form"><input id="sn" placeholder="姓名"><input id="sa" placeholder="登录账号（字母或数字）"><button class="btn" id="addS">新增</button></div><p class="muted">新员工首次登录需要修改初始密码。</p></div>`;
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const s=staff[+b.dataset.tg];s.active=!s.active;toast(s.active?'已启用':'已停用，该员工无法再登录');render()});
  $('addS').onclick=()=>{const n=$('sn').value.trim(),a=$('sa').value.trim();if(!n||!/^[A-Za-z0-9]+$/.test(a))return toast('请填写姓名和账号（字母或数字）');if(staff.some(s=>s.acc===a))return toast('这个账号已存在');staff.push({name:n,acc:a,role:'员工',active:true});toast('已新增 '+n);render()};
}
function aLog(){
  $('av').innerHTML=`<h3>电话查看记录</h3><p class="muted">谁在什么时候看过哪位客户的电话，都记在这里。</p>
  ${viewLog.length?`<div class="tbl-wrap"><table class="tbl"><tr><th>时间</th><th>查看人</th><th>订单号</th><th>号码</th></tr>${viewLog.map(v=>`<tr><td>${v.at}</td><td>${v.who}</td><td>${v.id}</td><td>${v.ph}</td></tr>`).join('')}</table></div>`:'<p class="muted">暂无记录。去“订单管理”点一次“查看”试试。</p>'}`;
}

render();
bnRestart();
</script>

</body></html>
